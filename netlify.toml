[build]
  publish = "public"
  # Minifies the published JS and CSS on Netlify's copy (the repository keeps readable sources).
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "xr-spatial-tracking=(self)"

# Short addresses: certificate (typed on the phone after the headset) and the big-screen leaderboard.
[[redirects]]
  from = "/z"
  to = "/zertifikat.html"
  status = 200

[[redirects]]
  from = "/board"
  to = "/bestenliste.html"
  status = 200
