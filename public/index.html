<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Echomotion AR Experience: Mixed-Reality-Spiele und Quiz über Künstliche Intelligenz für die Meta Quest 3. / Echomotion AR Experience: a mixed reality quiz about artificial intelligence for Meta Quest 3.">
  <meta name="theme-color" content="#0d1222">
  <title>Echomotion AR Experience</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    // The "sunny" design is no longer offered (Nov 2026): a stored choice is cleared.
    try { localStorage.removeItem('kiar.skin'); } catch (e) { /* storage unavailable */ }
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/game-bike.css">
  <link rel="stylesheet" href="css/game-roast.css">
  <link rel="stylesheet" href="css/game-bricks.css">
  <link rel="stylesheet" href="css/game-green.css">
  <link rel="stylesheet" href="css/game-dock.css">
  <link rel="stylesheet" href="css/game-pinball.css">
  <link rel="stylesheet" href="css/game-summit.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="page">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="./" aria-label="Echomotion AR Experience by Echomotion">
          <img class="brand__logo" src="assets/brand/echomotion-logo-96.webp" srcset="assets/brand/echomotion-logo-96.webp 1x, assets/brand/echomotion-logo-192.webp 2x" width="40" height="40" alt="" decoding="async">
          <span class="brand__text">
            <span data-i18n="appTitle">Echomotion AR Experience</span>
            <span class="brand__by">by Echomotion</span>
          </span>
        </a>
        <div class="topbar__controls">
          <div class="segmented" role="group" aria-label="Sprache / Language">
            <button type="button" class="segmented__item" data-lang="de" aria-pressed="true">DE</button>
            <button type="button" class="segmented__item" data-lang="en" aria-pressed="false">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="hero-band">
      <section class="hero container">
        <div class="hero__text">
          <!-- data-i18n-xmas: the text of the Christmas edition (SEASON in js/config.js) -->
          <p class="eyebrow" data-i18n="pageEyebrow" data-i18n-xmas="pageEyebrowXmas"></p>
          <h1 class="hero__title" data-i18n="appSubtitle" data-i18n-xmas="heroTitleXmas"></h1>
          <p class="byline"><a class="byline__link" href="https://www.echomotion.ai" target="_blank" rel="noopener">by Echomotion - AI Trainings &amp; More</a></p>
          <p class="hero__lead" data-i18n="pageLead" data-i18n-xmas="pageLeadXmas"></p>
          <p class="hero__sign" data-xmas hidden data-i18n="heroSignXmas"></p>
          <!-- A direct link to a game (?spiel=...): a personal invitation with the game's coin. -->
          <div class="invite" id="invite" hidden>
            <img class="invite__coin" id="invite-coin" src="" width="96" height="96" alt="">
            <div class="invite__body">
              <p class="invite__eyebrow" data-i18n="inviteEyebrow"></p>
              <p class="invite__title" id="invite-title"></p>
              <p class="invite__text" id="invite-text"></p>
              <button type="button" class="btn btn--primary" id="invite-play"></button>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn btn--primary btn--lg" id="btn-ar" hidden data-i18n="startAR"></button>
            <button type="button" class="btn btn--secondary btn--lg" id="btn-vr" hidden data-i18n="startVR"></button>
            <button type="button" class="btn btn--secondary btn--lg" id="btn-preview" data-i18n="playBrowser"></button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
        <figure class="hero__art" data-xmas hidden>
          <img src="assets/xmas-hero.webp" srcset="assets/xmas-hero-600.webp 599w, assets/xmas-hero.webp 1198w" sizes="(min-width: 900px) 46vw, 92vw" width="1198" height="722" alt="" data-i18n-alt="heroArtAlt" fetchpriority="high">
        </figure>
      </section>
      </div>

      <!-- The games for our clients: a coin each; a click opens that game in the browser. -->
      <section class="container section clients" id="clients" aria-labelledby="clients-title" hidden>
        <h2 class="section__title" id="clients-title" data-i18n="clientsPageTitle"></h2>
        <p class="section__lead" data-i18n="clientsPageText"></p>
        <ul class="clients__grid" id="clients-grid"></ul>
      </section>

      <section class="container section" aria-labelledby="ar-title">
        <aside class="callout callout--feature">
          <h2 class="callout__title" id="ar-title" data-i18n="arTitle"></h2>
          <p class="callout__text" data-i18n="arText"></p>
        </aside>
      </section>

    </main>

    <footer class="footer container">
      <p data-i18n="footer"></p>
      <p><a class="footer__link" href="https://www.echomotion.ai" target="_blank" rel="noopener">www.echomotion.ai</a></p>
    </footer>
  </div>

  <div id="stage" hidden>
    <button type="button" class="btn btn--secondary stage__close" id="btn-close" data-i18n="close" data-inset="top"></button>
    <p class="stage__hint" data-i18n="rotateHint"></p>
  </div>
</body>
</html>
